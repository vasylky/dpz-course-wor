services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport
      POSTGRES_DB: sport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://sport:sport@db:5432/sport
      JWT_SECRET: ${JWT_SECRET:-change-me-local-secret}
      UPLOAD_DIR: /app/uploads
      WEB_DIST: /app/web
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
